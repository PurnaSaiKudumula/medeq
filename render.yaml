# MedEQ — Render Blueprint
# ============================================================
# Deploys BOTH services (FastAPI backend + Streamlit frontend) with a
# single push of this repo to GitHub.
#
# HOW TO USE:
#   1. Push this repo to GitHub.
#   2. In Render Dashboard -> New -> Blueprint, connect the repo.
#   3. Render creates the two services below automatically.
#   4. On the *frontend* service, add the env var:
#        API_BASE_URL = https://<backend-service-name>.onrender.com
#      (copy the exact URL Render assigns to the backend service).
#   5. (Optional) Add GEMINI_API_KEY to enable live LLM SOP generation.
#
# NOTE: free web services sleep after ~15 min idle; first visit after
# sleep may take ~30-60s to wake. Fine for demos.

services:
  # ---------------- BACKEND: FastAPI ----------------
  - type: web
    name: medeq-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false # set manually in the dashboard to keep it secret

  # ---------------- FRONTEND: Streamlit ----------------
  - type: web
    name: medeq-dashboard
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app_streamlit.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      # Point the dashboard at the backend service. Replace with the real
      # backend URL Render assigns (e.g. https://medeq-api.onrender.com).
      - key: API_BASE_URL
        value: https://medeq-api.onrender.com